# Copy this file to config.yaml and adjust it. config.yaml is not committed.
# Only where things are and the safety limits: what to do comes as orders.

body:
  url: http://robot.local            # the robot's control API

head:
  url: http://robot-head.local       # the camera board
  mirrored: false                    # true if the picture shows left and right swapped

model:
  url: http://localhost:11434        # Ollama
  name: qwen2.5vl:7b                 # qwen3-vl models work too (their boxes come on a 0-1000 scale)
  timeout_s: 60                      # the first answer also loads the model
  keep_alive: 15m                    # how long Ollama keeps the model loaded
  max_answer_tokens: 100             # short answers are what make looking fast

max_speed: 0.6                       # no walk or turn command above this (0-1)

data_dir: data                       # journal of every look and move
